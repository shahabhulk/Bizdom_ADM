name: Deploy Branch to AWS EC2 (CD)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Select branch to deploy to EC2'
        required: true
        default: 'master'
  push:
    branches: [ master ]

jobs:
  deploy:
    name: Deploy to Bitnami EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Native SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'master' }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no "$EC2_USERNAME@$EC2_HOST" << EOF
            set -e
            echo "=========================================="
            echo "Deploying branch: $TARGET_BRANCH"
            echo "=========================================="
            
            cd /home/bitnami/Bizdom_ADM_new
            git fetch --all
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
            
            # Sync files to Bitnami addons directory
            sudo rsync -av --exclude='__pycache__/' --exclude='*.pyc' --exclude='.git/' /home/bitnami/Bizdom_ADM_new/ /bitnami/odoo/addons/
            
            # Restart Odoo atomically (so Odoo is never left stopped)
            sudo /opt/bitnami/ctlscript.sh restart odoo
            
            echo "=========================================="
            echo "Successfully deployed branch: $TARGET_BRANCH to EC2!"
            echo "=========================================="
          EOF
